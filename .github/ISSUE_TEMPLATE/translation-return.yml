name: Return a translation
description: Send Sliger a translation file downloaded from the translation editor.
title: "Translation: "
labels: ["translation-return"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for translating. In the translation editor, click **Download translation file**,
        then drag that file (it ends in `-translation.json`) into the box below. Sliger will review
        it, and a pull request with the translated PDFs will be linked here.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Deutsch (de)"
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Translation file
      description: Drag the downloaded `-translation.json` file here. Do not edit it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for Sliger
      description: Optional. Notes entered in the editor are included in the file already.

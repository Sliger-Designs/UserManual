name: Return a translation
description: Send Sliger a translation ZIP downloaded from the translation editor.
title: "Translation: "
labels: ["translation-return"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for translating. In the translation editor, click **Download ZIP for Sliger**,
        then drag that ZIP file into the box below. Sliger will review it, and a pull request with
        the translated PDFs will be linked here.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Deutsch (de)"
    validations:
      required: true
  - type: textarea
    id: zip
    attributes:
      label: Translation ZIP
      description: Drag the ZIP file here. Do not unpack or edit it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for Sliger
      description: Optional. Notes entered in the editor are included in the ZIP already.
